<script type="py">
import pandas as pd
import numpy as np
import requests
import json
import ccxt
from pyscript import document

import pyodide_http
pyodide_http.patch_all()

def obtener_datos_binance(simbolo, intervalo, limite):
    try:
        url = f"https://binance.com{simbolo.strip()}&interval={intervalo}&limit={limite}"
        respuesta = requests.get(url)
        if respuesta.status_code == 200:
            datos = respuesta.json()
            df = pd.DataFrame(datos, columns=[
                'time', 'open', 'high', 'low', 'close', 'volume', 
                'close_time', 'q_volume', 'trades', 'taker_base', 'taker_quote', 'ignore'
            ])
            df['time'] = df['time'] // 1000
            df['open'] = df['open'].astype(float)
            df['high'] = df['high'].astype(float)
            df['low'] = df['low'].astype(float)
            df['close'] = df['close'].astype(float)
            df['volume'] = df['volume'].astype(float)
            return df
    except:
        return None

def escanear_motor_inteligente(df, tipo_patron, winrate_minimo):
    compras = []
    ventas = []
    
    df['EMA_200'] = df['close'].ewm(span=200, adjust=False).mean()
    df_btc = obtener_datos_binance("BTCUSDT", "15m", len(df))
    if df_btc is not None:
        df_btc['EMA_200'] = df_btc['close'].ewm(span=200, adjust=False).mean()

    for i in range(20, len(df)):
        open_p = df['open'].iloc[i]
        high_p = df['high'].iloc[i]
        low_p = df['low'].iloc[i]
        close_p = df['close'].iloc[i]
        ema_actual = df['EMA_200'].iloc[i]
        
        rango_total = high_p - low_p
        if rango_total == 0: continue
        cuerpo = abs(close_p - open_p)
        
        v_verde = False
        v_roja = False
        
        if tipo_patron == "original":
            v_verde = close_p > open_p and (cuerpo / rango_total) >= 0.70
            v_roja = close_p < open_p and (cuerpo / rango_total) >= 0.70
        elif tipo_patron == "envolvente":
            open_ant = df['open'].iloc[i-1]
            close_ant = df['close'].iloc[i-1]
            v_verde = close_ant < open_ant and close_p > open_p and close_p > open_ant and open_p < close_ant
            v_roja = close_ant > open_ant and close_p < open_p and close_p < open_ant and open_p > close_ant

        # SIEMPRE BIDIRECCIONAL EN TODOS LOS NIVELES
        if winrate_minimo < 65:
            if v_verde: compras.append(i)
            elif v_roja: ventas.append(i)
            
        elif 65 <= winrate_minimo <= 75:
            vol_prom = df['volume'].iloc[i-20:i].mean()
            if df['volume'].iloc[i] > vol_prom:
                if v_verde and close_p > ema_actual: compras.append(i)
                elif v_roja and close_p < ema_actual: ventas.append(i)
                
        elif winrate_minimo > 75:
            vol_prom = df['volume'].iloc[i-20:i].mean()
            if df_btc is not None and df['volume'].iloc[i] > (vol_prom * 1.2) and (cuerpo / rango_total) >= 0.75:
                btc_alcista = df_btc['close'].iloc[i] > df_btc['EMA_200'].iloc[i]
                if v_verde and close_p > ema_actual and btc_alcista: compras.append(i)
                elif v_roja and close_p < ema_actual and not btc_alcista: ventas.append(i)
                
    return compras, ventas
