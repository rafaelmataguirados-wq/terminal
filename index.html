import pandas as pd
import numpy as np
import requests
import json
from js import document, LightweightCharts

# Forzar a requests a usar el motor HTTP del navegador mediante pyodide
import pyodide_http
pyodide_http.patch_all()

def obtener_datos_binance(simbolo, intervalo, limite):
    url = f"https://binance.com{simbolo.strip()}&interval={intervalo}&limit={limite}"
    respuesta = requests.get(url)
    if respuesta.status_code == 200:
        datos = respuesta.json()
        df = pd.DataFrame(datos, columns=[
            'time', 'open', 'high', 'low', 'close', 'volume', 
            'close_time', 'q_volume', 'trades', 'taker_base', 'taker_quote', 'ignore'
        ])
        df['time'] = df['time'] // 1000
        df['open'] = df['open'].astype(float)
        df['high'] = df['high'].astype(float)
        df['low'] = df['low'].astype(float)
        df['close'] = df['close'].astype(float)
        return df
    return None

def escanear_patrones(df, tipo_patron):
    alertas = []
    for i in range(1, len(df)):
        open_p = df['open'].iloc[i]
        high_p = df['high'].iloc[i]
        low_p = df['low'].iloc[i]
        close_p = df['close'].iloc[i]
        
        rango_total = high_p - low_p
        if rango_total == 0: continue
        
        cuerpo = abs(close_p - open_p)
        
        if tipo_patron == "original":
            if close_p > open_p and (cuerpo / rango_total) >= 0.70:
                alertas.append(i)
                
        elif tipo_patron == "envolvente":
            open_ant = df['open'].iloc[i-1]
            close_ant = df['close'].iloc[i-1]
            if close_ant < open_ant and close_p > open_p and close_p > open_ant and open_p < close_ant:
                alertas.append(i)
    return alertas

def renderizar_grafico(df):
    contenedor = document.getElementById("chart-container")
    contenedor.innerHTML = ""
    
    chart = LightweightCharts.createChart(contenedor, {
        "width": contenedor.clientWidth,
        "height": 350,
        "layout": {"backgroundColor": "#161a1e", "textColor": "#d1d4dc"},
        "grid": {
            "vertLines": {"color": "rgba(42, 46, 57, 0.2)"},
            "horzLines": {"color": "rgba(42, 46, 57, 0.2)"}
        },
        "timeScale": {"timeVisible": True}
    })
    
    candle_series = chart.addCandlestickSeries({
        "upColor": "#26a69a", "downColor": "#ef5350",
        "borderDownColor": "#ef5350", "borderUpColor": "#26a69a",
        "wickDownColor": "#ef5350", "wickUpColor": "#26a69a"
    })
    
    registros = []
    for _, row in df.iterrows():
        registros.append({
            "time": int(row['time']),
            "open": float(row['open']),
            "high": float(row['high']),
            "low": float(row['low']),
            "close": float(row['close'])
        })
        
    from pyodide.ffi import to_js
    candle_series.setData(to_js(registros))

def iniciar_sistema(event):
    consola = document.getElementById("output")
    consola.innerHTML = "Iniciando escaneo del mercado..."
    
    activos_input = document.getElementById("activo").value
    temporalidad = document.getElementById("temporalidad").value
    limite = document.getElementById("limite").value
    algoritmo = document.getElementById("patron-tipo").value
    
    lista_activos = activos_input.split(",")
    primer_df = None
    resumen_logs = "--- RESULTADOS DEL ESCANEO ---\n"
    
    for activo in lista_activos:
        activo = activo.strip().upper()
        if not activo: continue
        
        df = obtener_datos_binance(activo, temporalidad, limite)
        if df is not None:
            if primer_df is None:
                primer_df = df
            
            indices_patron = escanear_patrones(df, algoritmo)
